name: Build and Release Desktop Apps

on:
  push:
    tags:
      - 'v*' # Se déclenche quand tu crées un tag (ex: v1.4.0)
  workflow_dispatch: # Permet de lancer la compilation manuellement depuis GitHub

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write # Permet à l'action de publier sur la page "Releases"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # electron-builder publishes under v${package.json.version} while the Android
      # job uploads to ${GITHUB_REF_NAME}. If the tag and package.json disagree the
      # desktop and APK assets land on different releases. Fail fast instead.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($PKG)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # The committed package-lock.json is generated on Linux and only records
      # the Linux native binaries for optional deps (lightningcss, @next/swc,
      # @tailwindcss/oxide…). On Windows/macOS npm then skips the matching
      # platform binary and the build fails with "Cannot find module
      # lightningcss.win32-x64-msvc.node". Resolve per-runner instead.
      - name: Install dependencies
        shell: bash
        run: |
          rm -f package-lock.json
          npm install

      - name: Prepare Web App
        run: npm run build

      - name: Prepare Desktop
        run: npm run desktop:prepare

      - name: Build and Publish Electron App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always

  # Build the native Android APK and attach it to the same release. Runs after the
  # desktop build has created/published the release (gh release upload only ADDS the
  # asset — it never touches the release notes electron-builder wrote).
  android:
    runs-on: ubuntu-latest
    needs: build
    # Runs on a tag push (the normal release path) AND on a manual workflow_dispatch.
    # Push-triggered runs sometimes don't fire on a repo (transient GitHub event
    # delivery), so dispatch must be able to drive the full release too. The version
    # is read from package.json (REL_TAG below) rather than the ref, so a dispatch
    # from main still stamps/attaches the correct v1.x.y assets.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      # The stable app-signing keystore is NO LONGER committed (the old one leaked, so
      # it was regenerated and gitignored). Restore it from a base64 secret, and feed
      # the passwords via the env vars build.gradle.kts already reads. Without this the
      # release build fails at :app:validateSigningRelease ("keystore not found").
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty — cannot sign the release APK"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android-native/app/auralis.keystore
      - name: Resolve release tag from package.json
        # On a tag push GITHUB_REF_NAME is already v1.x.y; on a workflow_dispatch
        # from main it's "main". Derive the tag from package.json so dispatch can
        # produce a correctly-named, correctly-stamped APK without a tag ref.
        id: reltag
        run: echo "REL_TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build native Android APK
        # Stamp the APK with the release tag so the in-app updater can compare the
        # running version against the latest GitHub release (see UpdateManager.kt).
        env:
          AURALIS_VERSION: ${{ steps.reltag.outputs.REL_TAG }}
          ANDROID_KEYSTORE_PWD: ${{ secrets.ANDROID_KEYSTORE_PWD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PWD: ${{ secrets.ANDROID_KEY_PWD }}
        run: npm run mobile:native
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_TAG: ${{ steps.reltag.outputs.REL_TAG }}
        run: |
          cp android-native/app/build/outputs/apk/release/app-release.apk "Auralis-${REL_TAG}.apk"
          gh release upload "${REL_TAG}" "Auralis-${REL_TAG}.apk" --clobber
      # electron-builder leaves the GitHub release as a DRAFT on a matrix build (each
      # runner races to finalize it, so none flips it to published), despite
      # `releaseType: release`. A draft is invisible to the public, is excluded from
      # `gh release list` (so the APT job below never indexes the new .deb) AND is not
      # "latest" (so the Android in-app updater, which queries releases/latest, never
      # sees it). Un-draft it here — after all assets are attached, before apt-repo.
      - name: Publish the release (un-draft + mark latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_TAG: ${{ steps.reltag.outputs.REL_TAG }}
        run: gh release edit "${REL_TAG}" --draft=false --latest

  # Regenerate and redeploy the APT repository once the .deb is attached to the
  # release. The `on: release` trigger in apt-repo.yml never fires here because the
  # release is published with the default GITHUB_TOKEN, and GitHub deliberately
  # blocks workflow chaining from GITHUB_TOKEN-created events. workflow_dispatch is
  # the documented exception, so we dispatch it explicitly. Runs last so the new
  # .deb is already in the release before the pool is rebuilt.
  apt-repo:
    runs-on: ubuntu-latest
    needs: [build, android]
    # Same tag-or-dispatch gate as the android job: keeps the normal tag-triggered
    # path, and lets a manual dispatch finish the full release (desktop + APK + APT).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      actions: write
    steps:
      - name: Trigger APT repository rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run apt-repo.yml --repo "${GITHUB_REPOSITORY}" --ref main
