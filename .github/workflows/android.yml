name: Build Android APK

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.18.0)
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Allow publishing to releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Resolve release tag from package.json
        id: reltag
        run: echo "REL_TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is empty — building unsigned APK"
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android-native/app/auralis.keystore
          fi

      - name: Build native Android APK
        env:
          AURALIS_VERSION: ${{ steps.reltag.outputs.REL_TAG }}
          ANDROID_KEYSTORE_PWD: ${{ secrets.ANDROID_KEYSTORE_PWD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PWD: ${{ secrets.ANDROID_KEY_PWD }}
        run: npm run mobile:native

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_TAG: ${{ steps.reltag.outputs.REL_TAG }}
        run: |
          if [ -f "android-native/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android-native/app/build/outputs/apk/release/app-release.apk "Auralis-${REL_TAG}.apk"
            gh release upload "${REL_TAG}" "Auralis-${REL_TAG}.apk" --clobber
          else
            echo "::warning::Release APK not found"
          fi

      - name: Upload build artifacts (for debugging)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-outputs
          path: android-native/app/build/outputs/
          retention-days: 7