name: Play Store AAB

# Builds ONLY the signed Android App Bundle (.aab) — the format Google Play
# REQUIRES for new apps (APKs are rejected at the Play Console upload step).
#
# Why a dedicated workflow: release.yml drives the full desktop pipeline
# (Electron builds on ubuntu + windows) before its android job runs, which
# takes 30+ minutes. When you are sitting in the Play Console with the
# "Drop your app bundles here" dialog open, you just need the .aab — this
# job builds it from the current main in ~5 minutes and attaches it to the
# existing release (v{package.json version}), creating that release first
# if it does not exist yet (e.g. before the first tag).

on:
  workflow_dispatch: # Manual trigger from the Actions tab or the API
  push:
    tags:
      - "v*" # Also produce the .aab on every tag release

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      # Same signing story as release.yml: the stable upload keystore lives in
      # the ANDROID_KEYSTORE_BASE64 secret (it is gitignored since the original
      # one leaked). The .aab is signed with the upload key; on the first
      # upload Google Play enrolls the app in Play App Signing and keeps its
      # own app signing key — the keystore must stay stable for every future
      # upload.
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty — cannot sign the release AAB"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android-native/app/auralis.keystore

      - name: Resolve release tag from package.json
        id: reltag
        run: echo "REL_TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build signed Android App Bundle (.aab, play flavor)
        env:
          AURALIS_VERSION: ${{ steps.reltag.outputs.REL_TAG }}
          ANDROID_KEYSTORE_PWD: ${{ secrets.ANDROID_KEYSTORE_PWD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PWD: ${{ secrets.ANDROID_KEY_PWD }}
        # No npm install needed: the build script only uses Node built-ins and
        # drives gradlew, and the native client talks to the server over HTTP
        # (it embeds no web assets). The `play` flavor strips
        # REQUEST_INSTALL_PACKAGES (a restricted permission on Google Play) and
        # disables the in-app self-updater — store builds update via the store.
        run: node scripts/build-native-apk.mjs --aab --flavor=play

      - name: Attach AAB to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_TAG: ${{ steps.reltag.outputs.REL_TAG }}
        run: |
          cp android-native/app/build/outputs/bundle/playRelease/app-play-release.aab "Auralis-${REL_TAG}.aab"
          # Create the release (draft) if this tag has no release yet — a tag
          # push normally has one from release.yml's electron-builder, but a
          # manual dispatch before any tag would not.
          gh release view "${REL_TAG}" >/dev/null 2>&1 || \
            gh release create "${REL_TAG}" --draft --title "Auralis ${REL_TAG}" \
              --notes "Auralis ${REL_TAG} — see CHANGELOG.md for details."
          gh release upload "${REL_TAG}" "Auralis-${REL_TAG}.aab" --clobber
          echo "::notice::AAB attached: Auralis-${REL_TAG}.aab"
